plugins {
    id 'com.android.application'
}

// 版本号外置：发版脚本 publish_apk.sh 会自增并写回，APP 启动更新检查以 APK versionCode 为准
def versionPropsFile = file('../version.properties')
def versionProps = new Properties()
if (versionPropsFile.canRead()) {
    versionPropsFile.withInputStream { versionProps.load(it) }
}
def appVersionCode = (versionProps['versionCode'] ?: '1').toInteger()
def appVersionName = versionProps['versionName'] ?: '1.0.1'

android {
    namespace 'com.game65713.ccapp'
    compileSdk 35

    defaultConfig {
        applicationId 'com.game65713.ccapp'
        minSdk 23
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
